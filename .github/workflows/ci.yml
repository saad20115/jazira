name: CI

on:
  push:
    branches:
      - main
      - 'phase-*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Verify (Node 24 · Postgres 18 · Mailpit)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: '1025'
      MAILPIT_UI_PORT: '8025'
      SMTP_FROM_ADDRESS: no-reply@aljazira.co
      SMTP_FROM_NAME: Al Jazira for Imdad Smart Co.
      # P5-T2: a CI-only test inbox (Mailpit catches it); also grepped for in the client bundle.
      SALES_INBOX: sales-inbox@ci.example.test

    services:
      postgres:
        image: postgres:18.6@sha256:5486e8fb206952552c7e2eaf2e36e4c7be3cd36b2b396eb41de618aa5664a781
        env:
          POSTGRES_USER: postgres_admin
          POSTGRES_PASSWORD: ci_superuser_bootstrap_pass
          POSTGRES_DB: postgres
          POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=scram-sha-256
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres_admin -d postgres -h 127.0.0.1"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

      mailpit:
        image: axllent/mailpit:v1.31.6@sha256:23fe39e81bde596a918000b3135c0f85dc8bb4c9ea6be274b051143f3e300387
        ports:
          - 127.0.0.1:1025:1025
          - 127.0.0.1:8025:8025

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm 10.34.7
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.7

      - name: Setup Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Generate per-run secrets and initialize non-superuser DB role (S1, S2, D1)
        run: |
          set -euo pipefail
          PAYLOAD_SECRET="$(openssl rand -base64 48 | tr -d '\n')"
          IP_HASH_SALT="$(openssl rand -base64 48 | tr -d '\n')"
          APP_DB_PASS="$(openssl rand -hex 24)"

          echo "::add-mask::${PAYLOAD_SECRET}"
          echo "::add-mask::${IP_HASH_SALT}"
          echo "::add-mask::${APP_DB_PASS}"

          PGPASSWORD="ci_superuser_bootstrap_pass" psql -h 127.0.0.1 -U postgres_admin -d postgres -v ON_ERROR_STOP=1 <<SQL
          CREATE ROLE aljazira_app WITH LOGIN PASSWORD '${APP_DB_PASS}' NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION;
          CREATE DATABASE aljazira_dev OWNER aljazira_app;
          CREATE DATABASE aljazira_test OWNER aljazira_app;
          REVOKE ALL ON DATABASE aljazira_dev FROM PUBLIC;
          REVOKE ALL ON DATABASE aljazira_test FROM PUBLIC;
          GRANT ALL PRIVILEGES ON DATABASE aljazira_dev TO aljazira_app;
          GRANT ALL PRIVILEGES ON DATABASE aljazira_test TO aljazira_app;
          SQL

          {
            echo "SERVER_URL=http://localhost:3000"
            echo "PAYLOAD_SECRET=${PAYLOAD_SECRET}"
            echo "IP_HASH_SALT=${IP_HASH_SALT}"
            echo "APP_DB_PASS=${APP_DB_PASS}"
            echo "DATABASE_URL=postgresql://aljazira_app:${APP_DB_PASS}@127.0.0.1:5432/aljazira_dev"
            echo "TEST_DATABASE_URL=postgresql://aljazira_app:${APP_DB_PASS}@127.0.0.1:5432/aljazira_test"
            echo "PAYLOAD_JOBS_AUTORUN=true"
          } >> "$GITHUB_ENV"

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Check formatting
        run: pnpm format:check

      - name: Verify generated design tokens are up to date (P3-T1)
        run: pnpm tokens:check

      - name: Verify generated Payload types are up to date
        run: |
          set -euo pipefail
          pnpm payload generate:types
          git diff --exit-code src/payload-types.ts

      - name: Run database migrations (up / status / down / up)
        run: |
          pnpm payload migrate
          pnpm payload migrate:status
          pnpm payload migrate:down
          pnpm payload migrate
          pnpm payload migrate:status

      - name: Verify zero Payload migration drift
        run: |
          set -euo pipefail
          OUT="$(echo n | pnpm payload migrate:create ci_drift_check --no-color 2>&1)"
          echo "$OUT"
          echo "$OUT" | grep -Fq "No schema changes detected"
          if [ -n "$(git status --porcelain src/migrations)" ]; then
            echo "ERROR: Uncommitted migration changes detected in src/migrations!" >&2
            exit 1
          fi

      - name: Run unit and integration tests
        run: pnpm test

      - name: Build production bundle and verify zero client secret leakage (S4)
        run: |
          set -euo pipefail
          pnpm build
          if grep -Fq "$PAYLOAD_SECRET" -R .next/static; then
            echo "ERROR: PAYLOAD_SECRET value leaked into .next/static!" >&2
            exit 1
          fi
          if grep -Fq "$IP_HASH_SALT" -R .next/static; then
            echo "ERROR: IP_HASH_SALT value leaked into .next/static!" >&2
            exit 1
          fi
          if grep -Fq "$APP_DB_PASS" -R .next/static; then
            echo "ERROR: Database password leaked into .next/static!" >&2
            exit 1
          fi
          if grep -Fq "__ALJAZIRA_SERVER_ONLY_MODULE_SENTINEL_S4_" -R .next/static; then
            echo "ERROR: Server-only module sentinel leaked into .next/static (R-6)!" >&2
            exit 1
          fi
          # P5-T2 §6: the sales inbox value and the server-only variable names (SMTP_*, SALES_INBOX,
          # PAYLOAD_SECRET, IP_HASH_SALT) must not appear anywhere in the client bundle.
          if grep -Fq "$SALES_INBOX" -R .next/static; then
            echo "ERROR: SALES_INBOX value leaked into .next/static!" >&2
            exit 1
          fi
          for name in SMTP_ SALES_INBOX PAYLOAD_SECRET IP_HASH_SALT; do
            if grep -Fq "$name" -R .next/static; then
              echo "ERROR: server-only variable name $name found in .next/static!" >&2
              exit 1
            fi
          done
          echo "client bundle: no secret value or server-only variable name found"

      - name: Run Playwright e2e smoke tests
        run: pnpm test:e2e

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Verify Phase 2 report citations (R-13)
        run: |
          pnpm check:citations docs/reports/phase-2.md handoff/reports/P2-T8.md docs/reports/evidence/P2-T8/r3/citations.log
          pnpm check:citations handoff/reports/P2-T9.md docs/reports/evidence/P2-T9/r1/citations.log

      - name: Scan git history with gitleaks (S3)
        run: |
          set -euo pipefail
          GITLEAKS_VERSION="8.24.2"
          GITLEAKS_SHA256="fa0500f6b7e41d28791ebc680f5dd9899cd42b58629218a5f041efa899151a8e"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git --no-banner --redact --verbose .
